name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for training_data.csv changes
        id: check_changes
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$before^{commit}" 2>/dev/null; then
            if git diff --name-only "$before" HEAD | grep -qx 'training_data.csv'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Train linear model
        if: steps.check_changes.outputs.changed == 'true'
        run: python train_model.py

      - name: Commit model to main
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add linear_model.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update linear model [skip ci]"
          fi

      - name: Push model to release branch
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git checkout --orphan temp_release
          git rm -rf .
          git checkout main -- linear_model.txt
          git add linear_model.txt
          git commit -m "Update linear model on release branch"
          git push -f origin temp_release:release

      - name: Create GitHub Release
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automated release generated by CI/CD pipeline." \
            ./linear_model.txt
